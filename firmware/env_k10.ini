#
# EasyThreed K10 V2.1 (GD32F303CBT6 を STM32F103CB として扱う)
# 純正SDブートローダ(0x08000000-0x08003FFF)を残し、アプリを 0x08004000 に置く
#
[env:custom]
extends                     = stm32_variant
board                       = genericSTM32F103CB
board_build.offset          = 0x4000
board_upload.offset_address = 0x08004000
# PlatformIO レジストリからのダウンロードが極端に遅い場合は、GitHub から取得したローカルコピーを使える
# (firmware/README.md 参照)。その場合は下の4行のコメントを外してパスを書き換える
#platform_packages           = toolchain-gccarmnoneeabi@symlink://C:/path/to/pkgs/toolchain-gccarmnoneeabi
#                              framework-arduinoststm32@symlink://C:/path/to/pkgs/framework-arduinoststm32
#                              framework-cmsis@symlink://C:/path/to/pkgs/framework-cmsis
#custom_gcc                  = C:/path/to/pkgs/toolchain-gccarmnoneeabi/bin/arm-none-eabi-g++.exe
build_flags                 = ${stm32_variant.build_flags}
                              -DTIMER_SERVO=TIM3 -DTIMER_TONE=TIM2
build_unflags               = ${stm32_variant.build_unflags}
                              -DUSBCON -DUSBD_USE_CDC
